<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Inquisitor: Red Moon Town — Twine Edition</title>
<style>
  :root{color-scheme:dark;--bg:#0b0f14;--card:#141b26;--fg:#e8edf3;--accent:#8ab4f8;--border:#1f2d3d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 "Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
  main{max-width:720px;width:100%;padding:24px}
  h1{font-size:22px;margin:0 0 16px;text-align:center;letter-spacing:0.03em}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 22px 46px #0006}
  #story{display:flex;flex-direction:column;gap:14px;margin-bottom:24px;min-height:180px}
  #story p{margin:0}
  .choices{display:flex;flex-direction:column;gap:10px}
  button{appearance:none;border-radius:999px;border:1px solid var(--border);background:#0f1826;color:var(--fg);padding:10px 18px;font:inherit;cursor:pointer;text-align:left;transition:background 160ms}
  button:hover{background:#122135}
  button:disabled{opacity:0.5;cursor:default}
  .small{font-size:13px;color:#b5c7df;text-align:center;margin-top:18px}
</style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Inquisitor: Red Moon Town</h1>
      <div id="story"></div>
      <div id="choiceRoot" class="choices"></div>
      <div class="small">
        <button id="restart">Restart the tale</button>
      </div>
    </div>
  </main>
<script>
(function(){
  const storyEl=document.getElementById('story');
  const choiceEl=document.getElementById('choiceRoot');
  const restartBtn=document.getElementById('restart');

  const state={};

  const PASSAGES={
    start:{
      text:"A red moon crowns the town. As royal inquisitor you must uncover the werewolf before nightfall.",
      choices:[
        {label:"Enter the crescent-timber inn",next:"innEntry"},
        {label:"Inspect the market square",next:"square"},
        {label:"Lurk on the rooftops and watch",next:"rooftop"}
      ]
    },
    innEntry:{
      text:s=>s.hasProof?"Innkeeper Garran polishes a glass, eyes darting to the trapdoor. He knows you carry proof." :"Innkeeper Garran greets you with a forced smile. Rumors say his cellars never close.",
      choices:[
        {label:"Press Garran with what you know", next:s=>s.hasProof?"accuse" : "noProof"},
        {label:"Slip behind the counter toward the trapdoor", next:s=>s.hasLantern?"cellar" : "darkCellar"},
        {label:"Return to the square", next:"square"}
      ]
    },
    square:{
      text:s=>{
        if(!s.visitedSquare){
          s.visitedSquare=true;
          return "The square sits hushed. Merchants whisper of disappearances. Two figures remain brave enough to meet your eye.";
        }
        return "Stalls creak under the moon's pull. The seamstress and blacksmith await your decision.";
      },
      choices:[
        {label:"Question the seamstress",next:"seamstress",condition:s=>!s.heardSeamstress},
        {label:"Consult the blacksmith",next:"blacksmith",condition:s=>!s.hasLantern},
        {label:"Head back to the inn",next:"innEntry"},
        {label:"Wait here for nightfall",next:"nightfall"}
      ]
    },
    rooftop:{
      text:"Hours pass as you watch chimneys breathe mist. Without a plan the moon outpaces you.",
      choices:[
        {label:"Drop to the street and decide quickly",next:"square"},
        {label:"Keep waiting",next:"nightfall"}
      ]
    },
    seamstress:{
      text:s=>{
        s.heardSeamstress=true;
        s.hasProof=true;
        return "The seamstress clutches a torn sleeve. \"This cloth is from Garran's private stock, stained with blood.\"";
      },
      choices:[
        {label:"Thank her and return to the inn",next:"innEntry"},
        {label:"Seek more aid",next:"square"}
      ]
    },
    blacksmith:{
      text:s=>{
        s.hasLantern=true;
        return "The blacksmith thrusts a lantern into your hands. \"Cellars under the inn run deep. Take this.\"";
      },
      choices:[
        {label:"Hurry to the inn cellar",next:"cellar"},
        {label:"Circle back to the square",next:"square"}
      ]
    },
    darkCellar:{
      text:"You crack the trapdoor, swallowed by pitch-black steps. Without light the darkness laughs you back out.",
      choices:[
        {label:"Retreat for supplies",next:"square"},
        {label:"Confront Garran anyway",next:"noProof"}
      ]
    },
    cellar:{
      text:s=>{
        s.foundAltar=true;
        return "Lantern raised, you find a blood-slick altar and wolf pelts drying on hooks. The truth can no longer hide.";
      },
      choices:[
        {label:"Storm upstairs to accuse Garran",next:"accuse"},
        {label:"Seal the cellar and wait",next:"nightfall"}
      ]
    },
    noProof:{
      text:"You accuse Garran but your words are hollow. Patrons laugh, Garran grins, and the moon keeps climbing.",
      choices:[
        {label:"Regroup elsewhere",next:"square"},
        {label:"Let night fall",next:"nightfall"}
      ]
    },
    accuse:{
      text:s=>{
        if(s.hasProof && s.foundAltar){
          return "You slam the cellar door open, revealing the altar. Garran's bones twist and the beast howls — too late. Your blade, readied, ends him before the moon drinks more blood.";
        }
        if(s.hasProof){
          return "You reveal the bloodied sleeve. Garran stumbles, claws pushing through his skin. With villagers watching, you strike first and the werewolf collapses.";
        }
        return "You shout Garran's guilt. Without evidence, he only smiles.";
      },
      choices:s=>{
        if(s.hasProof){
          return [{label:"Breathe as dawn breaks",next:"victory"}];
        }
        return [{label:"Try again",next:"square"}];
      }
    },
    nightfall:{
      text:"Night swallows Red Moon Town. The werewolf hunts freely, and by dawn the cobbles run red.",
      end:"defeat"
    },
    victory:{
      text:"Dawn cracks the horizon. Villagers gather around the slain beast, whispering thanks as the red moon fades.",
      end:"victory"
    }
  };

  function reset(){
    for(const key of Object.keys(state)) delete state[key];
    storyEl.innerHTML='';
    advance('start');
  }

  function advance(id){
    const passage=PASSAGES[id];
    if(!passage) return;
    const text=typeof passage.text==='function'?passage.text(state):passage.text;
    addLine(text);
    renderChoices(passage);
  }

  function addLine(text){
    const p=document.createElement('p');
    p.textContent=text;
    storyEl.appendChild(p);
    storyEl.scrollTop=storyEl.scrollHeight;
  }

  function renderChoices(passage){
    choiceEl.innerHTML='';
    if(passage.end){
      const msg=passage.end==='victory'?"Victory" : "Defeat";
      addLine(msg+": your tale in Red Moon Town is complete.");
      const btn=document.createElement('button');
      btn.textContent='Restart';
      btn.onclick=reset;
      choiceEl.appendChild(btn);
      return;
    }
    const choices=typeof passage.choices==='function'?passage.choices(state):passage.choices;
    if(!choices||!choices.length){
      const btn=document.createElement('button');
      btn.textContent='Continue';
      btn.onclick=()=>advance('start');
      choiceEl.appendChild(btn);
      return;
    }
    for(const choice of choices){
      if(choice.condition && !choice.condition(state)) continue;
      const btn=document.createElement('button');
      btn.textContent=choice.label;
      btn.onclick=()=>{
        const next=typeof choice.next==='function'?choice.next(state):choice.next;
        advance(next);
      };
      choiceEl.appendChild(btn);
    }
  }

  restartBtn.onclick=reset;
  reset();
})();
</script>
</body>
</html>
